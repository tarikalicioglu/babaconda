<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Babaconda</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17103a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Babaconda">
<script src="peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #17103a; font-family: 'Outfit', sans-serif; color: #fff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud.on { display: block; }
  #stat { position: absolute; top: 10px; left: 12px; font-weight: 800; font-size: 20px; text-shadow: 0 3px 0 #5b3fb0; }
  #lives { font-size: 17px; color: #ff5fb0; letter-spacing: 2px; text-shadow: none; }
  #mag { font-size: 14px; color: #ff5fb0; text-shadow: none; }
  #mis { position: absolute; left: 0; top: 152px; width: 210px; font-size: 13px; font-weight: 700; color: #ffd166; text-shadow: 0 2px 0 #17103a; }
  #timer { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 22px; text-shadow: 0 3px 0 #5b3fb0; }
  #pList { max-width: 420px; margin: 16px auto; }
  .prow { display: flex; justify-content: space-between; padding: 12px 16px; margin-top: 8px; border-radius: 16px; font-weight: 800; font-size: 19px; background: #241a55; }
  .prow.p0 { background: linear-gradient(#ffd166, #e0a92e); color: #3a2400; font-size: 23px; }
  #lives i { font-style: normal; color: rgba(255,255,255,.22); }
  #board { position: absolute; top: 10px; right: 10px; background: rgba(23,16,58,.6); border-radius: 12px; font-size: 11.5px; line-height: 17px; width: 150px; height: 20px; }
  #board .br { position: absolute; left: 6px; right: 6px; height: 17px; padding: 0 4px; border-radius: 6px; display: flex; justify-content: space-between; gap: 10px; color: #c7b8ff; transition: top .35s ease; }
  #board .br.me { color: #7ef2c8; font-weight: 800; background: rgba(126,242,200,.12); }
  #board .br.up { animation: rankup .8s ease-out; }
  @keyframes rankup { 0% { background: rgba(126,242,200,.55); transform: scale(1.08); } 100% { background: rgba(126,242,200,.12); transform: none; } }
  #split { position: absolute; right: 18px; bottom: 96px; width: 92px; height: 92px; border-radius: 50%; border: 0; pointer-events: auto; font: 800 19px 'Outfit', sans-serif; color: #063326; background: linear-gradient(#7ef2c8, #2fc49a); box-shadow: 0 7px 0 #1c8a6c, 0 0 26px rgba(126,242,200,.35); touch-action: none; }
  .bst { position: absolute; width: 68px; height: 68px; border-radius: 50%; border: 0; pointer-events: auto; font: 800 11px 'Outfit', sans-serif; color: #fff; touch-action: none; }
  #bSpd { right: 124px; bottom: 108px; background: linear-gradient(#ffb057, #ff7a1a); box-shadow: 0 6px 0 #b04a00, 0 0 20px rgba(255,122,26,.35); }
  #bMag { right: 30px; bottom: 206px; background: linear-gradient(#ff8ac6, #ff3c9a); box-shadow: 0 6px 0 #a3185f, 0 0 20px rgba(255,60,154,.35); }
  .bst.off { filter: grayscale(.8); opacity: .5; }
  #split.off { filter: grayscale(.8); opacity: .5; box-shadow: 0 7px 0 #1c8a6c; }
  #toast { position: absolute; top: 25%; left: 50%; transform: translateX(-50%) scale(.6); padding: 10px 22px; border-radius: 22px; white-space: nowrap; font-weight: 800; font-size: 22px; color: #fff; background: linear-gradient(#9a7bff, #5b3fb0); box-shadow: 0 6px 0 #3a2580, 0 0 30px rgba(123,102,214,.45); opacity: 0; transition: opacity .25s; }
  #toast.on { opacity: 1; animation: pop .45s cubic-bezier(.2,1.7,.4,1) forwards; }
  #toast.good { color: #063326; background: linear-gradient(#9ff7d8, #2fc49a); box-shadow: 0 6px 0 #1c8a6c, 0 0 30px rgba(126,242,200,.45); }
  #toast.bad { background: linear-gradient(#ff8aa8, #e0335f); box-shadow: 0 6px 0 #9a1a3c, 0 0 30px rgba(255,60,110,.45); }
  #toast.gold { color: #3a2400; background: linear-gradient(#ffe08a, #e0a92e); box-shadow: 0 6px 0 #9a6a10, 0 0 30px rgba(255,209,102,.5); }
  @keyframes pop { 0% { transform: translateX(-50%) scale(.3); } 100% { transform: translateX(-50%) scale(1); } }
  #bigCount { position: absolute; top: 36%; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 120px; color: rgba(255,95,176,.95); text-shadow: 0 8px 0 #5b3fb0; opacity: 0; }
  #bigCount.beat { animation: beat .95s ease-out forwards; }
  @keyframes beat { 0% { transform: scale(1.7); opacity: 1; } 100% { transform: scale(1); opacity: .12; } }
  #specBar { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 14px; font-weight: 800; font-size: 13px; background: rgba(224,51,95,.85); white-space: nowrap; display: none; }
  #hud.spec #specBar { display: block; }
  #hud.spec #split, #hud.spec .bst { display: none; }
  #bigMsg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-weight: 800; font-size: 54px; color: #ffd166; text-shadow: 0 6px 0 #9a6a10, 0 0 40px rgba(255,209,102,.6); opacity: 0; }
  #bigMsg.on { animation: slam .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes slam { 0% { transform: scale(2.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  #pStage { display: flex; align-items: flex-end; justify-content: center; gap: 8px; max-width: 420px; height: 310px; margin: 14px auto 4px; }
  .pcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; opacity: 0; min-width: 0; }
  .pcol canvas { width: 100%; height: auto; }
  .pcol b { font-weight: 800; font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcol span { color: #c7b8ff; font-size: 14px; margin-bottom: 6px; }
  .pbar { width: 100%; border-radius: 14px 14px 0 0; padding-top: 8px; text-align: center; font-weight: 800; font-size: 30px; color: #3a2400; }
  #pc0 .pbar { height: 140px; background: linear-gradient(#ffe08a, #e0a92e); }
  #pc1 .pbar { height: 100px; background: linear-gradient(#f0f0f8, #9a9ab5); }
  #pc2 .pbar { height: 68px; background: linear-gradient(#f3b98a, #b5682a); }
  .pcol.go { animation: rise .75s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(140px); } 100% { opacity: 1; transform: none; } }
  #pc0.go canvas { animation: bob 1.1s ease-in-out .9s infinite alternate; }
  @keyframes bob { to { transform: translateY(-8px) rotate(-3deg); } }
  #pList { display: none; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #oTitle.pop { animation: slam .5s cubic-bezier(.2,1.6,.4,1); }
  .ov { position: fixed; inset: 0; display: none; overflow-y: auto; background: rgba(15,9,40,.82); padding: 22px 16px 40px; text-align: center; }
  .ov.on { display: block; }
  .ov h1 { font-weight: 800; font-size: 44px; text-shadow: 0 6px 0 #5b3fb0; margin-top: 6px; }
  .ov p { color: #c7b8ff; font-size: 14.5px; line-height: 1.5; margin: 8px auto; max-width: 420px; }
  .pickgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 420px; margin: 14px auto; }
  .pick { background: radial-gradient(circle at 50% 30%, #3b2a7a, #17103a 80%); border: 3px solid transparent; border-radius: 14px; padding: 2px 2px 6px; font: 700 11px/1.15 'Outfit', sans-serif; color: #fff; min-width: 0; overflow: hidden; }
  .pick canvas { width: 100%; height: auto; display: block; }
  .pick.taken { opacity: .35; }
  .txt { display: block; width: 100%; max-width: 420px; margin: 14px auto 0; padding: 14px; border: 0; border-radius: 16px; font: 700 17px 'Outfit', sans-serif; text-align: center; color: #fff; background: #241a55; box-shadow: inset 0 0 0 2px #7b66d6; -webkit-user-select: text; user-select: text; }
  .txt.code { font-size: 34px; letter-spacing: 10px; text-transform: uppercase; }
  #roomCode { letter-spacing: 10px; color: #7ef2c8; }
  .pick.sel { border-color: #7ef2c8; box-shadow: 0 0 22px rgba(126,242,200,.4); }
  .big { display: block; width: 100%; max-width: 420px; margin: 12px auto 0; padding: 16px 0; border: 0; border-radius: 22px; font: 800 20px 'Outfit', sans-serif; color: #063326; background: linear-gradient(#7ef2c8, #2fc49a); box-shadow: 0 8px 0 #1c8a6c, 0 0 30px rgba(126,242,200,.35); }
  .ghost { background: transparent; color: #c7b8ff; box-shadow: inset 0 0 0 2px #7b66d6; font-size: 16px; }
  .ghost[disabled] { opacity: .55; }
  #diff, #opts { display: flex; gap: 8px; max-width: 420px; margin: 6px auto 0; }
  .dbtn { flex: 1; padding: 13px 0; border: 0; border-radius: 16px; font: 800 16px 'Outfit', sans-serif; color: #c7b8ff; background: transparent; box-shadow: inset 0 0 0 2px #7b66d6; }
  .dbtn.sel { color: #063326; background: linear-gradient(#7ef2c8, #2fc49a); box-shadow: 0 5px 0 #1c8a6c; }
  .num { font-weight: 800; font-size: 30px; color: #7ef2c8; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="stat"><span id="lenL"></span> <span id="len">10</span><div id="lives"></div><div id="mag"></div><div id="mis"></div></div>
  <div id="timer"></div>
  <div id="board"></div>
  <div id="toast"></div>
  <div id="bigCount"></div>
  <div id="specBar"></div>
  <button id="split">BÖL</button>
  <button class="bst" id="bSpd"></button>
  <button class="bst" id="bMag"></button>
</div>

<div class="ov on" id="menu">
  <h1>Babaconda</h1>
  <p id="mPick"></p>
  <div id="picker" class="pickgrid"></div>
  <div id="diff">
    <button class="dbtn" id="dEasy"></button>
    <button class="dbtn sel" id="dNormal"></button>
    <button class="dbtn" id="dHard"></button>
  </div>
  <p id="dInfo"></p>
  <button class="big" id="play"></button>
  <input class="txt" id="name" maxlength="10">
  <button class="big ghost" id="mkRoom"></button>
  <button class="big ghost" id="joinRoom"></button>
  <p id="menuMsg"></p>
  <div id="opts">
    <button class="dbtn" id="langBtn"></button>
    <button class="dbtn" id="sndBtn"></button>
  </div>
  <p id="mStars"></p>
  <p id="mHelp"></p>
  <p id="mHelp2"></p>
</div>

<div class="ov" id="join">
  <h1 id="jTitle"></h1>
  <p id="jInfo"></p>
  <input class="txt code" id="code" maxlength="4" autocapitalize="characters" autocomplete="off">
  <p id="joinMsg"></p>
  <button class="big" id="joinGo"></button>
  <button class="big ghost" id="joinBack"></button>
</div>

<div class="ov" id="room">
  <p id="rLabel"></p>
  <h1 id="roomCode">....</h1>
  <p id="roomMsg"></p>
  <div id="roomPicker" class="pickgrid"></div>
  <button class="big ghost" id="botBtn"></button>
  <button class="big" id="startBtn"></button>
  <button class="big ghost" id="leaveBtn"></button>
</div>

<div class="ov" id="over">
  <h1 id="oTitle"></h1>
  <p id="oSub"></p>
  <p><span id="oBestL"></span><br><span class="num" id="oBest">0</span></p>
  <p><span id="oKillsL"></span><br><span class="num" id="oKills">0</span></p>
  <button class="big" id="again"></button>
  <button class="big ghost" id="toMenu"></button>
</div>

<div class="ov" id="podium">
  <h1 id="pTitle"></h1>
  <div id="pStage">
    <div class="pcol" id="pc1"><canvas id="pk1" width="320" height="208"></canvas><b id="pn1"></b><span id="pl1"></span><div class="pbar">2</div></div>
    <div class="pcol" id="pc0"><canvas id="pk0" width="320" height="208"></canvas><b id="pn0"></b><span id="pl0"></span><div class="pbar">1</div></div>
    <div class="pcol" id="pc2"><canvas id="pk2" width="320" height="208"></canvas><b id="pn2"></b><span id="pl2"></span><div class="pbar">3</div></div>
  </div>
  <div id="pList"></div>
  <p id="pMe"></p>
  <p id="pWait"></p>
  <button class="big" id="nextRound"></button>
  <button class="big ghost" id="podMenu"></button>
  <canvas id="confetti"></canvas>
</div>

<div id="bigMsg"></div>

<script>
(() => {
'use strict';

const TYPES = [
  { name:'Zehir', c:'#58c43a', hi:'#d9ffb8', lo:'#1d5a16', p:'#10240c', p2:'#b9f26a', eye:'#ffe14a', tongue:'#ff3b5c', head:'viper', pattern:'diamond', fangs:1, rattle:1 },
  { name:'Kara Kobra', c:'#3a2d55', hi:'#9a86c9', lo:'#120b22', p:'#e0b44a', p2:'#120b22', eye:'#ff3030', tongue:'#ff5a7a', head:'slim', pattern:'band', hood:1, fangs:1 },
  { name:'Lav', c:'#2b2326', hi:'#7a6a6e', lo:'#0c0809', p:'#ff7a1a', p2:'#ffd23f', eye:'#ffb020', tongue:'#ff7a1a', head:'viper', pattern:'lava', horns:1, fangs:1 },
  { name:'Hidra', c:'#1fa38f', hi:'#b8fff2', lo:'#0a4039', p:'#062a26', p2:'#b8fff2', eye:'#ff9a1a', tongue:'#ff5a7a', head:'viper', pattern:'tiger', twin:1, fangs:1 },
  { name:'İskelet', c:'#1c1a24', hi:'#6d6a80', lo:'#050409', p:'#f1ece0', p2:'#f1ece0', eye:'#b45cff', tongue:'#b45cff', head:'viper', pattern:'bone', spikes:1, fangs:1 },
  { name:'Altın Ejder', c:'#e0a92e', hi:'#fff1b8', lo:'#6e4a08', p:'#8a1c1c', p2:'#ff5a3c', eye:'#ff2d2d', tongue:'#ff2d2d', head:'viper', pattern:'diamond', frill:1, horns:1, fangs:1 },
  { name:'Buz Dikeni', c:'#4fc3e8', hi:'#e6fbff', lo:'#155a7a', p:'#0e3e57', p2:'#e6fbff', eye:'#ffffff', tongue:'#b9f1ff', head:'viper', pattern:'stripe', spikes:1, fangs:1 },
  { name:'Mercan', c:'#d92b2b', hi:'#ff9c8a', lo:'#6e0f12', p:'#141414', p2:'#ffd23f', eye:'#ffd23f', tongue:'#ff8a8a', head:'slim', pattern:'coral' },
  { name:'Alex', c:'#ffd200', hi:'#fff4b0', lo:'#7a6200', p:'#0b1f4d', p2:'#0b1f4d', eye:'#ffffff', tongue:'#ff3b5c', head:'viper', pattern:'band', fangs:1 },
  { name:'Lefter', c:'#13306e', hi:'#7a9ad9', lo:'#060f26', p:'#ffd200', p2:'#ffd200', eye:'#ffd200', tongue:'#ffd200', head:'slim', pattern:'stripe' },
  { name:'Hagi', c:'#c8102e', hi:'#ff8a8a', lo:'#4a0410', p:'#ffb81c', p2:'#ffb81c', eye:'#ffb81c', tongue:'#ffb81c', head:'viper', pattern:'band', horns:1, fangs:1 },
  { name:'Metin Oktay', c:'#ffb81c', hi:'#ffe9b0', lo:'#7a4a00', p:'#c8102e', p2:'#7a0010', eye:'#ff3030', tongue:'#c8102e', head:'slim', pattern:'diamond' },
  { name:'Sergen', c:'#151515', hi:'#6a6a6a', lo:'#000000', p:'#ffffff', p2:'#ffffff', eye:'#ffffff', tongue:'#ff3b5c', head:'viper', pattern:'band', fangs:1 },
  { name:'Feyyaz', c:'#f2f2f2', hi:'#ffffff', lo:'#6a6a6a', p:'#151515', p2:'#151515', eye:'#ff3030', tongue:'#151515', head:'slim', pattern:'stripe', spikes:1 },
  { name:'Şenol', c:'#7a1f3d', hi:'#e08aa6', lo:'#2a0814', p:'#5fb4e5', p2:'#5fb4e5', eye:'#5fb4e5', tongue:'#5fb4e5', head:'viper', pattern:'band', frill:1, fangs:1 },
  { name:'Hami', c:'#5fb4e5', hi:'#d6efff', lo:'#1d5a80', p:'#7a1f3d', p2:'#4a0a20', eye:'#ffffff', tongue:'#7a1f3d', head:'slim', pattern:'diamond' },
  { name:'Hakan Kutlu', c:'#0e2a6b', hi:'#7a9ad9', lo:'#040c22', p:'#ffd200', p2:'#ffd200', eye:'#ffd200', tongue:'#ffd200', head:'viper', pattern:'tiger', horns:1, fangs:1 },
  { name:'Batalla', c:'#0b7a3b', hi:'#9ae6b8', lo:'#033015', p:'#ffffff', p2:'#ffffff', eye:'#ffffff', tongue:'#ff3b5c', head:'viper', pattern:'band', fangs:1 },
  { name:'Višća', c:'#f26a1b', hi:'#ffd0b0', lo:'#6a2a05', p:'#13306e', p2:'#13306e', eye:'#ffffff', tongue:'#13306e', head:'viper', pattern:'stripe', spikes:1, fangs:1 },
  { name:'Fevzi Zemzem', c:'#e2231a', hi:'#ff9a8a', lo:'#5a0805', p:'#ffd200', p2:'#ffd200', eye:'#ffd200', tongue:'#ffd200', head:'slim', pattern:'coral' }
];
const BOT_NAMES = ['Tıslayan','Engerek','Şahmeran','Çıngırak','Karayılan','Sinsi','Gölge','Fısıltı','Sarmal','Avcı','Yutan','Hışırtı','Kıvrım','Pullu','Zehirli','Boğan','Sürüngen','Diş','Kuyruk','Pusu','Kement','Tırpan','Kara Bela','Uzun'];
const DOT_COLS = ['#7ef2c8', '#ff5fb0', '#ffd166', '#6ec3ff', '#c79bff'];

const CELL = 160, TAU = Math.PI * 2;
let W = 4000, GC = 25, worldNoBots = false;
function setMap(gc) { GC = gc; W = gc * CELL; }
const specN = k => GC === 25 ? SPEC[k].n : Math.max(k === 'g50' ? 1 : 2, Math.round(SPEC[k].n * GC * GC / 625));
const BOTS = 15, LIVES = 3, START_M = 10, SPLIT_MIN = 16, EQ = 3;
const MAG_R = 260, MAG_T = 8, HIT_PROT = 3;
const SPEC = { g10: { n: 6, v: 10, r: 11, w: 10 }, g50: { n: 1, v: 50, r: 17, w: 50 }, mag: { n: 6, v: 0, r: 13, w: 8 },
  shd: { n: 3, v: 0, r: 13, w: 6 }, gho: { n: 3, v: 0, r: 13, w: 5 }, frz: { n: 3, v: 0, r: 13, w: 5 },
  tur: { n: 3, v: 0, r: 13, w: 6 }, dbl: { n: 3, v: 0, r: 13, w: 6 } };
const ROUND_T = 180, FINAL_T = 30, BOOST_CD = 10;
const DE_NAMES = ['Gift', 'Schwarze Kobra', 'Lava', 'Hydra', 'Skelett', 'Goldener Drache', 'Eisstachel', 'Koralle', 'Alex', 'Lefter', 'Hagi', 'Metin Oktay', 'Sergen', 'Feyyaz', 'Şenol', 'Hami', 'Hakan Kutlu', 'Batalla', 'Višća', 'Fevzi Zemzem'];
const LOCKS = {};
const MISSIONS = [['kills', 2], ['len', 80], ['gold', 2], ['mag', 2], ['kills', 3], ['len', 150], ['gold', 4], ['len', 250], ['kills', 5]];
let roundOn = false, roundLeft = 0, finalOn = false, evId = 0, evKind = '', evNext = 0, speedUntil = 0, kingId = 0, lastKing = 0;
let lang = 'tr', soundOn = true, shake = 0, mis = null, misIdx = 0, misWait = 0;
const save = { stars: 0 };
let specials = [];
const DIFFS = {
  easy:   { prey: 200, hunt: false, split: 0,   think: .4,  m: [10, 10], prot: 5 },
  normal: { prey: 320, hunt: true,  split: .25, think: .2,  m: [10, 10], prot: 3 },
  hard:   { prey: 460, hunt: true,  split: .5,  think: .12, m: [10, 10], prot: 3 }
};
let diff = 'normal';
const rnd = (a, b) => a + Math.random() * (b - a);
const wd = d => d > W / 2 ? d - W : (d < -W / 2 ? d + W : d);
const wrap = v => v < 0 ? v + W : (v >= W ? v - W : v);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const radiusOf = m => 9 + Math.min(16, Math.sqrt(m) * 1.05);
const $ = id => document.getElementById(id);

const cv = $('c'), ctx = cv.getContext('2d');
let vw = 0, vh = 0, dpr = 1, bgGrad = null;
let owners = [], pieces = [], cells = [], player = null, time = 0, mode = 'menu';
let selType = 0, hudT = 0, toastT = 0;
let nextOid = 0, nextPid = 0, nextFid = 0, netAdd = [], netRem = [];
const net = { role: null, peer: null, conn: null, started: false, room: [], myRid: 0, you: 0, acc: 0, inAcc: 0, lastAng: 9, code: '' };
const ownById = new Map(), pcById = new Map(), foodById = new Map();
const hosting = () => net.role === 'host' && net.started;
const isClient = () => net.role === 'client' && net.started;
const KINDS = [null, null, 'g10', 'g50', 'mag', 'shd', 'gho', 'frz', 'tur', 'dbl'];
let homing = [];
function reg(f, cell) { f.id = ++nextFid; f.cell = cell; f.born = time; cell.items.push(f); if (hosting()) netAdd.push(f); return f; }
const enc = f => [f.id, Math.round(f.x), Math.round(f.y), f.k, f.ci, f.owner && time < f.ownUntil ? f.owner : 0];
function toastFor(o, key, arg) { if (o === player) showToast(key, arg); else if (o.conn) (o.evq || (o.evq = [])).push([key, arg === undefined ? '' : arg]); }
const cam = { x: W / 2, y: W / 2, z: 1 };

/* ---------- food ---------- */
